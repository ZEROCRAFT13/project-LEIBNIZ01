# テストして、検証環境・本番環境に反映する
#   main に入ったら … テスト → 検証環境（staging）に自動で反映
#   本番（production）… Actions の画面で「Run workflow」→ target に production を選んで手で動かす。
#                       GitHub の Environment「production」で承認者を決めておくと、承認してから動く
# Google Cloud へは鍵を置かずに入る（Workload Identity。infra/setup.sh で設定）。値は Environment の Variables に入れる
name: 反映

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 反映する先
        type: choice
        options: [staging, production]
        default: production

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  test:
    name: テスト
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ZB_DB_MODE: local
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app --no-audit --no-fund
      - run: npm run db:test
      - run: npm test
      - run: npm run lint
      - run: npm run build

  deploy:
    name: 反映（${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}）
    needs: test
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    env:
      REGION: asia-northeast1
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
      IMAGE: asia-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/zerobit/app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: コンテナを作って置く
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
          docker build --build-arg ZB_VERSION="${GITHUB_SHA::7}" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: 本番は、反映の前にデータベースのバックアップを取る
        if: env.TARGET == 'production'
        run: gcloud sql backups create --instance=zerobit-db --description="反映の前 ${GITHUB_SHA::7}" --project="${{ vars.GCP_PROJECT_ID }}"

      - name: マイグレーション（まだ流していないものだけ）
        run: |
          gcloud run jobs deploy zerobit-migrate --project="${{ vars.GCP_PROJECT_ID }}" --region="$REGION" --image="$IMAGE" \
            --service-account="${{ vars.GCP_MIGRATE_SA }}" --set-cloudsql-instances="${{ vars.GCP_SQL_CONNECTION }}" \
            --set-secrets="DATABASE_URL_ADMIN=db-admin-url:latest,ZB_APP_PASSWORD=zb-app-password:latest" \
            --command=node --args=scripts/migrate.mjs --max-retries=0 --task-timeout=600s
          gcloud run jobs execute zerobit-migrate --project="${{ vars.GCP_PROJECT_ID }}" --region="$REGION" --wait

      - name: 画面を反映する
        run: |
          SECRETS="DATABASE_URL=database-url:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,ZB_JOB_SECRET=zb-job-secret:latest"
          if [ "$TARGET" = production ]; then
            SECRETS="$SECRETS,SP_API_CLIENT_ID=sp-api-client-id:latest,SP_API_CLIENT_SECRET=sp-api-client-secret:latest,SP_API_REFRESH_TOKEN=sp-api-refresh-token:latest"
          fi
          gcloud run deploy zerobit --project="${{ vars.GCP_PROJECT_ID }}" --region="$REGION" --image="$IMAGE" \
            --service-account="${{ vars.GCP_RUN_SA }}" --add-cloudsql-instances="${{ vars.GCP_SQL_CONNECTION }}" \
            --ingress=internal-and-cloud-load-balancing --allow-unauthenticated \
            --cpu=1 --memory=1Gi --min-instances=0 --max-instances=3 --timeout=300 \
            --set-secrets="$SECRETS" \
            --set-env-vars="APP_URL=https://${{ vars.ZB_DOMAIN }},ZB_PUBLIC_URL=https://${{ vars.ZB_DOMAIN }},AUTH_ALLOWED_DOMAIN=${{ vars.AUTH_ALLOWED_DOMAIN }},ZB_STORAGE_BUCKET=${{ vars.ZB_STORAGE_BUCKET }}"

      - name: 動いているか確かめる
        if: vars.ZB_SMOKE_TEST != 'off'
        run: |
          for i in $(seq 1 10); do
            body=$(curl -fsS "https://${{ vars.ZB_DOMAIN }}/api/health" || true)
            echo "$body"
            if echo "$body" | grep -q "\"version\":\"${GITHUB_SHA::7}\"" && echo "$body" | grep -q '"db":true'; then exit 0; fi
            sleep 10
          done
          echo "::error::新しい版が動いていません。docs/deploy.md の「1つ前の版に戻す」を見てください"
          exit 1
